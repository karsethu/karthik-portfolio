<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karthik Sethuraman - Director of Engineering</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #1e40af;
            --text-main: #334155;
            --text-muted: #64748b;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .resume-container {
            max-width: 920px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
        }

        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1.25rem;
            margin-bottom: 1.75rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.02em;
            margin-bottom: 0.2rem;
        }

        header .subtitle {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.925rem;
            color: var(--text-muted);
        }

        .contact-info a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        section {
            margin-bottom: 1.75rem;
        }

        section h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--secondary-color);
            display: inline-block;
            padding-bottom: 0.2rem;
            margin-bottom: 0.85rem;
        }

        .summary p {
            font-size: 0.975rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 0.85rem;
        }

        .skill-card {
            background-color: var(--bg-light);
            padding: 0.85rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .skill-card h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .skill-card p {
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .job-entry {
            margin-bottom: 1.5rem;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 0.35rem;
        }

        .job-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .job-company {
            color: var(--secondary-color);
        }

        .job-details {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        ul.bullets {
            list-style-type: disc;
            padding-left: 1.2rem;
        }

        ul.bullets li {
            margin-bottom: 0.35rem;
            font-size: 0.925rem;
            line-height: 1.5;
        }

        .edu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 0.5rem 1.5rem;
        }

        .edu-item p {
            font-size: 0.9rem;
        }

        .edu-item strong {
            color: var(--primary-color);
        }

        /* Optimized for Printing / Exporting to PDF */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .resume-container {
                box-shadow: none;
                border: none;
                padding: 0;
                max-width: 100%;
            }
            section {
                margin-bottom: 1.25rem;
            }
            .job-entry {
                page-break-inside: avoid;
            }
        }

        @media (max-width: 600px) {
            .resume-container {
                padding: 1.25rem;
            }
            .job-header {
                flex-direction
